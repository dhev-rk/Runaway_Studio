name: Build Windows release

# Runs on a pushed tag like "v1.0.0" (a real release), or manually from the
# Actions tab (a test build -- the .exe is still attached as a workflow
# artifact you can download, just no GitHub Release is created for it).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download a static Windows FFmpeg build
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $binDir = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 | Select-Object -ExpandProperty DirectoryName
          Copy-Item (Join-Path $binDir "ffmpeg.exe") -Destination "."
          Copy-Item (Join-Path $binDir "ffprobe.exe") -Destination "."

      - name: Build the Windows app with PyInstaller
        run: pyinstaller runaway_studio.spec

      - name: Zip the build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -eq "") { $version = "dev" }
          Compress-Archive -Path "dist/RunawayStudio/*" -DestinationPath "RunawayStudio-$version-windows.zip"

      - name: Upload build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunawayStudio-windows
          path: RunawayStudio-*-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RunawayStudio-*-windows.zip
          generate_release_notes: true
